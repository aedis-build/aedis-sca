# Merge gate: after every aedis-ci run on a pull request, and after every human approval (review-signal),
# evaluates .github/aedis-merge-policy.yaml and, when everything passes, approves as the "Aedis Compliance" GitHub
# App and enables auto-merge. Runs from main (workflow_run) and never checks out the pull request's code.
name: gate

on:
  workflow_run:
    workflows: [aedis-ci, review-signal]
    types: [completed]

permissions: {}

jobs:
  gate:
    if: contains(fromJSON('["pull_request", "pull_request_review"]'), github.event.workflow_run.event)
    uses: aedis-build/aedis-platform/.github/workflows/merge-gate.yml@0372306df888c2e382079df0482e2f63d5aba7db # v1.0.3
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    with:
      head-sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      app-id: ${{ secrets.AEDIS_APP_ID }}
      app-private-key: ${{ secrets.AEDIS_APP_PRIVATE_KEY }}
