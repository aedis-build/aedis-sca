# Quality pipeline of this action: Conventional Commits, SAST (Semgrep with the Aedis rules) and REUSE through the
# Aedis Platform reusables, the tests of the summary and the acceptances (unit self-test and fixtures), and the action
# itself against this repository. The gate (gate.yml) listens for the end of this workflow on pull requests.
name: aedis-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "17 5 * * *"

# One run per pull request: a new push or closing the PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  commits:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/conventional-commits.yml@87835c71df53fae48e13a535f6b04de95bca5955 # v1.2.2
    permissions:
      contents: read

  sast:
    if: github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/sast.yml@87835c71df53fae48e13a535f6b04de95bca5955 # v1.2.2
    permissions:
      contents: read
      security-events: write

  test:
    if: github.event.action != 'closed'
    name: Self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash test/run.sh
      - run: pipx run reuse==5.0.2 lint

  # The action against its own repository: no lock file, no Dockerfile and no secret, so the gate passes with an
  # empty summary; the daily schedule catches a new advisory for anything added later.
  sca:
    if: github.event.action != 'closed'
    name: SCA of this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: sca
      - name: The summary says what the gate saw
        env:
          RESULT: ${{ steps.sca.outputs.result }}
        run: |
          set -euo pipefail
          test "$RESULT" = pass
          python3 -c "import json; s=json.load(open('sca/deps-summary.json')); assert s['schema']=='aedis.platform/deps-summary/v2' and s['result']=='pass' and s['tools']['trivy']['ran'] and s['blocking']==0, s"
          test -s sca/trivy.sarif
