# OpenSSF Scorecard through the Aedis Platform reusable: weekly, on push to main and by hand; results published to
# the Scorecard API (public badge) and the SARIF to code scanning. This file only holds the trigger and permissions.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    uses: aedis-build/aedis-platform/.github/workflows/scorecard.yml@4d715640b144e85e962c5cb6e0ab77631f4f8464 # v4.1.1
    permissions:
      contents: read
      security-events: write
      id-token: write
