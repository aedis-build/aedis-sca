# OpenSSF Scorecard through the Aedis Platform reusable: weekly, on push to main and by hand; results published to
# the Scorecard API (public badge) and the SARIF to code scanning. This file only holds the trigger and permissions.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    uses: aedis-build/aedis-platform/.github/workflows/scorecard.yml@0372306df888c2e382079df0482e2f63d5aba7db # v1.0.3
    permissions:
      contents: read
      security-events: write
      id-token: write
